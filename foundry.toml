[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
# Exact settings used for the Arbitrum One deployment — required to reproduce
# the on-chain bytecode.
optimizer = true
optimizer_runs = 1
via_ir = true
bytecode_hash = "ipfs"
cbor_metadata = true

[rpc_endpoints]
arbitrum = "${ARBITRUM_RPC_URL}"

[fuzz]
runs = 256
